name: Release zip

# HACS installs from life_dashboard.zip on the release (zip_release in hacs.json), so every
# release needs that file, and its download count is the install count. The zip holds the
# integration's own files at its root, which is how HACS expects an integration zip.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the zip for"
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Attach life_dashboard.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Check the manifest version matches the tag
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/life_dashboard/manifest.json'))['version'])")
          if [ "$VERSION" != "$TAG" ]; then
            echo "manifest.json says $VERSION, the release is $TAG"
            exit 1
          fi
      - name: Build the zip
        run: |
          cd custom_components/life_dashboard
          find . -name '__pycache__' -prune -o -type f -print | sort | zip -q -X "$GITHUB_WORKSPACE/life_dashboard.zip" -@
          unzip -l "$GITHUB_WORKSPACE/life_dashboard.zip"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" life_dashboard.zip --clobber --repo "$GITHUB_REPOSITORY"
